#.github/workflows/deploy-nettverk.yml --- for utrulling
 
name: Rull ut nettverk og app
 
on:
  push:
    branches: [main]
    paths:
      - 'stacks/nettverk/**'
      - 'stacks/app/**'
      - 'modules/network/**'
      - 'modules/compute/**'
      - 'shared/backend.hcl'
      - '.github/workflows/deploy-nettverk.yml'
 
  workflow_dispatch:
    inputs:
      environment:
        description: Miljø – gjelder bare ved manuell kjøring
        type: choice
        options: [dev, test]
        default: dev
 
permissions:
  id-token: write
  contents: read

concurrency:
  group: nettverk-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
 
    env:
      MILJO: ${{ inputs.environment || 'dev' }}
 
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      TF_INPUT: false
      TF_IN_AUTOMATION: true
 
    steps:
      - name: Hent koden
        uses: actions/checkout@v5
 
      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Hent parameterfila fra Key Vault
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > stacks/nettverk/params.auto.tfvars

      - name: Kopier parameterfila til app-stacken
        run: cp stacks/nettverk/params.auto.tfvars stacks/app/params.auto.tfvars
 
      - name: Init
        working-directory: stacks/nettverk
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/nettverk.tfstate"
 
      - name: Validate
        working-directory: stacks/nettverk
        run: terraform validate
 
      - name: Plan
        working-directory: stacks/nettverk
        run: terraform plan
 
      - name: Apply
        working-directory: stacks/nettverk
        run: terraform apply -auto-approve
 
      - name: Verifiser at nettverket finnes i Azure
        working-directory: stacks/nettverk
        run: |
          RG=$(terraform output -raw resource_group_name)
          VNET=$(terraform output -raw vnet_name)
          STATE=$(az network vnet show --resource-group "$RG" --name "$VNET" \
                    --query provisioningState -o tsv)
          echo "$VNET i $RG: $STATE"
          test "$STATE" = "Succeeded"

      - name: Init app
        working-directory: stacks/app
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/app.tfstate"

      - name: Validate app
        working-directory: stacks/app
        run: terraform validate

      - name: Plan app
        working-directory: stacks/app
        run: terraform plan

      - name: Apply app
        working-directory: stacks/app
        run: terraform apply -auto-approve
 
      - name: Slett parameterfilene
        if: always()
        run: |
          rm -f stacks/nettverk/params.auto.tfvars
          rm -f stacks/app/params.auto.tfvars